services:
  - type: web
    name: ep053-strategy-finder-ai
    runtime: python
    rootDir: epics/ep_053_strategy_finder_AI
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false
    plan: starter
