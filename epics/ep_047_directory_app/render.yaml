# Render Blueprint for the Business Activation Directory Platform.
# Deploy: connect this repo in Render's dashboard and point it at this file,
# or `render blueprint launch` from the CLI. Secrets are never set here —
# they're filled in through Render's encrypted environment settings after
# first deploy (sync: false below marks exactly which ones).

databases:
  - name: ep047-directory-db
    plan: basic_256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: ep047-directory-app
    runtime: node
    plan: starter
    # This is a monorepo (github.com/edebell67/FS) — the app lives in a
    # subfolder, not the repo root, and the repo root has its own unrelated
    # package.json. Without rootDir, Render clones the whole repo and runs
    # buildCommand/startCommand from the repo root, which would build the
    # wrong project entirely.
    rootDir: epics/ep_047_directory_app
    buildCommand: npm install --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ep047-directory-db
          property: connectionString
      - key: AUTH_SECRET
        sync: false
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_OAUTH_REFRESH_TOKEN
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: PUBLIC_APP_ORIGIN
        sync: false

  # Site-generation loop (lib/generation/). Safe to deploy before an LLM key
  # exists -- runGenerationLoop() is a clean no-op whenever LLM_PROVIDER is
  # unset, never a failed run. Once a key is added below the same job starts
  # doing real work with no further deploy needed.
  - type: cron
    name: ep047-site-generation
    runtime: node
    plan: starter
    rootDir: epics/ep_047_directory_app
    schedule: "*/15 * * * *"
    buildCommand: npm install --include=dev
    startCommand: npm run generate:sites
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_KEY
        sync: false
      - key: PUBLIC_APP_ORIGIN
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
