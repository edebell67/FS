# Render Blueprint for the shared, multi-tenant website assistant API.
# Keep provider and admin credentials in Render's encrypted environment settings.
services:
  - type: web
    name: shared-website-assistant-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_TOKEN
        sync: false
