e": "23:25", "cum_net": -170.0, "cum_alt_net": 2025.0, "open": 0, "closed": 46}, {"time": "23:30", "cum_net": -170.0, "cum_alt_net": 2025.0, "open": 0, "closed": 46}, {"time": "23:35", "cum_net": -185.0, "cum_alt_net": 2040.0, "open": 1, "closed": 46}, {"time": "23:40", "cum_net": -185.0, "cum_alt_net": 2040.0, "open": 1, "closed": 46}, {"time": "23:45", "cum_net": -185.0, "cum_alt_net": 2050.0, "open": 1, "closed": 46}, {"time": "23:50", "cum_net": -185.0, "cum_alt_net": 2050.0, "open": 1, "closed": 46}, {"time": "23:55", "cum_net": -170.0, "cum_alt_net": 2060.0, "open": 1, "closed": 46}]}]};
    const timestamps = dataPayload.timestamps;
    const models = dataPayload.models;
    const hourlyTimeline = dataPayload.hourly_leaders_timeline;

    // Palette with high contrast
    const colors = [
      "#38bdf8", // Sky (DNA_201276)
      "#f43f5e", // Rose (DNA_202236)

      "#6366f1", // Indigo (DNA_201207)

        updateCardStyles();
        renderChart();
      });

    });

    // Populate Leader Cards
    models.forEach((m, idx) => {
      const color = colors[idx % colors.length];
      const card = document.createElement("div");
      card.className = "leader-card bg-slate-950/70 border border-slate-800 rounded-lg p-2.5 flex flex-col justify-between";
      card.id = `card_${m.meta.model}`;
      
      const hoursBadge = m.meta.hours_led.map(h => h.substring(0, 2) + "h").join(", ");

      card.innerHTML = `
        <div>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1.5">
              <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: ${color}"></span>
              <span class="font-bold text-xs text-white font-mono truncate">${m.meta.model}</span>

            <span class="text-[9px] uppercase font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-mono">${m.meta.product}</span>

        renderChart();

    function updateCardStyles() {
      models.forEach(m => {
        const card = document.getElementById(`card_${m.meta.model}`);
        if (!card) return;
        if (highlightedModel === null) {
          card.classList.remove("active");
          card.style.opacity = "1";
        } else if (highlightedModel === m.meta.model) {
          card.classList.add("active");
          card.style.opacity = "1";
        } else {
          card.classList.remove("active");
          card.style.opacity = "0.3";
        }
      });
    }

      highlightedModel = null;
      updateCardStyles();
      renderChart();
    });

    document.getElementById("btnDayWinner").addEventListener("click", () => {
      highlightedModel = "DNA_201038";
      updateCardStyles();
      renderChart();
    });

    document.getElementById("btnMiddayHero").addEventListener("click", () => {
      highlightedModel = "DNA_201696";
      updateCardStyles();
      renderChart();

    function renderChart() {
      const width = wrapper.clientWidth;
      const height = wrapper.clientHeight;
      const padLeft = 55;
      const padRight = 20;
      const padTop = 25;
      const padBottom = 35;

      const chartW = width - padLeft - padRight;
      const chartH = height - padTop - padBottom;

      const minVal = -100;
      const maxVal = 750;

      function getX(idx) {
        return padLeft + (idx / (timestamps.length - 1)) * chartW;
      }
      function getY(val) {
        return padTop + chartH - ((val - minVal) / (maxVal - minVal)) * chartH;
      }

      let svgHtml = '';

      // Grid lines & Y labels
      const yTicks = [-100, 0, 100, 200, 300, 400, 500, 600, 700];
      yTicks.forEach(tick => {
        const y = getY(tick);
        const strokeColor = tick === 0 ? '#475569' : '#1e293b';
        const strokeWidth = tick === 0 ? '1.5' : '1';
        const strokeDash = tick === 0 ? '' : 'stroke-dasharray="3,3"';
        svgHtml += `<line x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${strokeDash} />`;
        svgHtml += `<text x="${padLeft - 10}" y="${y + 3.5}" fill="#64748b" font-size="10" text-anchor="end" font-family="monospace">£${tick}</text>`;
      });

      // X labels (every ~3 hours)
      const hoursToLabel = ["00:00", "03:00", "06:00", "09:00", "12:00", "15:00", "18:00", "21:00", "23:55"];
      timestamps.forEach((t, idx) => {
        if (hoursToLabel.some(h => t.startsWith(h.substring(0, 3)) && t.endsWith(h.substring(3)))) {
          const x = getX(idx);
          svgHtml += `<line x1="${x}" y1="${padTop}" x2="${x}" y2="${padTop + chartH}" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,4" />`;
          svgHtml += `<text x="${x}" y="${height - 10}" fill="#64748b" font-size="10" text-anchor="middle" font-family="monospace">${t}</text>`;
        }
      });

      // Render Series Curves
      models.forEach((m, mIdx) => {
        const color = colors[mIdx % colors.length];
        const isHighlighted = highlightedModel === null || highlightedModel === m.meta.model;
        const opacity = isHighlighted ? (highlightedModel === m.meta.model ? "1" : "0.75") : "0.1";
        const strokeWidth = highlightedModel === m.meta.model ? "3.5" : (isHighlighted ? "1.8" : "1");

        const timeMap = {};
        m.series.forEach(pt => { timeMap[pt.time] = pt.cum_net; });

        let pathStr = '';
        let lastKnown = 0;
        timestamps.forEach((t, tIdx) => {
          if (timeMap[t] !== undefined) {
            lastKnown = timeMap[t];
          }
          const x = getX(tIdx);
          const y = getY(lastKnown);
          if (tIdx === 0) {
            pathStr += `M ${x} ${y}`;
          } else {
            pathStr += ` L ${x} ${y}`;
          }
        });

        svgHtml += `<path d="${pathStr}" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-opacity="${opacity}" style="transition: stroke-opacity 0.2s, stroke-width 0.2s;" />`;
      });

      // Crosshair elements
      svgHtml += `
        <line id="crosshairX" x1="0" y1="${padTop}" x2="0" y2="${padTop + chartH}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" style="display:none;" />
      `;

      svg.innerHTML = svgHtml;
    }

    renderChart();
    window.addEventListener("resize", renderChart);

    // Interactive Hover Tracking
    wrapper.addEventListener("mousemove", (e) => {
      const rect = wrapper.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const padLeft = 55;
      const padRight = 20;
      const chartW = rect.width - padLeft - padRight;

      if (mouseX < padLeft || mouseX > rect.width - padRight) {
        hideTooltip();
        return;
      }

      const ratio = (mouseX - padLeft) / chartW;
      const tIdx = Math.min(timestamps.length - 1, Math.max(0, Math.round(ratio * (timestamps.length - 1))));
      const timeStr = timestamps[tIdx];

      const crossX = padLeft + (tIdx / (timestamps.length - 1)) * chartW;
      const chX = document.getElementById("crosshairX");
      if (chX) {
        chX.setAttribute("x1", crossX);
        chX.setAttribute("x2", crossX);
        chX.style.display = "block";
      }

      // Find leading model at this time
      let topAtTime = null;
      let topNetAtTime = -99999;
      models.forEach(m => {
        const pt = m.series.find(p => p.time === timeStr);
        if (pt && pt.cum_net > topNetAtTime) {
          topNetAtTime = pt.cum_net;
          topAtTime = m;
        }
      });

      let rowsHtml = '';
      if (highlightedModel) {
        const m = models.find(mod => mod.meta.model === highlightedModel);
        if (m) {
          const pt = m.series.find(p => p.time === timeStr) || m.series[m.series.length - 1];
          const color = colors[models.indexOf(m) % colors.length];
          rowsHtml = `
            <div class="flex items-center justify-between gap-4 py-0.5 font-mono">
              <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full" style="background-color:${color}"></span>
                <span class="text-white font-bold">${m.meta.model}</span>
              </div>
              <span class="font-bold ${pt.cum_net >= 0 ? 'text-emerald-400' : 'text-rose-400'}">£${pt.cum_net.toFixed(1)}</span>
            </div>
            <div class="text-[10px] text-slate-400 font-mono mt-1">
              Open Trades: ${pt.open} | Closed: ${pt.closed}
            </div>
          `;
        }
      } else {
        // Show current leader at this snapshot plus next 3 closest
        const sortedAtTime = models.map(m => {
          const pt = m.series.find(p => p.time === timeStr) || { cum_net: 0 };
          return { model: m, net: pt.cum_net };
        }).sort((a, b) => b.net - a.net).slice(0, 4);

        sortedAtTime.forEach((item, rnk) => {
          const color = colors[models.indexOf(item.model) % colors.length];
          rowsHtml += `
            <div class="flex items-center justify-between gap-3 py-0.5 font-mono">
              <div class="flex items-center gap-1.5">
                <span class="text-[9px] text-slate-500">#${rnk + 1}</span>
                <span class="w-2 h-2 rounded-full" style="background-color:${color}"></span>
                <span class="text-slate-200 font-semibold">${item.model.meta.model}</span>
              </div>
              <span class="font-bold ${item.net >= 0 ? 'text-emerald-400' : 'text-rose-400'}">£${item.net.toFixed(1)}</span>
            </div>
          `;
        });
      }

      tooltip.style.display = "block";
      tooltip.style.left = `${crossX}px`;
      tooltip.style.top = `60px`;
      tooltip.innerHTML = `
        <div class="font-bold text-slate-100 border-b border-slate-700 pb-1 mb-1.5 font-mono flex justify-between">
          <span>${timeStr}</span>
          <span class="text-slate-400 text-[10px]">Snapshot #${tIdx + 1}</span>
        </div>
        ${rowsHtml}
        <div class="text-[9px] text-slate-500 pt-1 border-t border-slate-800 text-center mt-1">
          ${highlightedModel ? 'Viewing isolated curve' : 'Hover shows top performers at snapshot'}
        </div>
      `;
    });

    wrapper.addEventListener("mouseleave", hideTooltip);

    function hideTooltip() {
      tooltip.style.display = "none";
      const chX = document.getElementById("crosshairX");
      if (chX) chX.style.display = "none";
    }
