    const timestamps = dataPayload.timestamps;
    const models = dataPayload.models;

    // Distinguishable high-contrast modern palette
    const colors = [
      "#10b981", // Emerald (Top 1)
      "#06b6d4", // Cyan (Top 2)
      "#3b82f6", // Blue (Top 3)
      "#8b5cf6", // Purple (Top 4)
      "#ec4899", // Pink (Top 5)
      "#f59e0b", // Amber (Top 6)
      "#14b8a6", // Teal (Top 7)
      "#a855f7", // Violet (Top 8)
      "#f97316", // Orange (Top 9)
      "#eab308"  // Yellow (Top 10)
    ];

    let highlightedModel = null; // null = all normal

    const svg = document.getElementById("chartSvg");
    const wrapper = document.getElementById("chartWrapper");
    const tooltip = document.getElementById("tooltip");
    const legendContainer = document.getElementById("legendCards");

    // Populate Legend Cards
    models.forEach((m, idx) => {
      const color = colors[idx % colors.length];
      const card = document.createElement("div");
      card.className = "model-row bg-slate-950/70 border border-slate-800 rounded-lg p-2.5 flex flex-col justify-between";
      card.id = `card_${m.meta.model}`;
      card.innerHTML = `
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-1.5">
            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${color}"></span>
            <span class="font-bold text-xs text-white font-mono">${m.meta.model}</span>
          </div>
          <span class="text-[10px] uppercase font-bold px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-mono">${m.meta.product}</span>
        </div>
        <div class="mt-1.5 flex items-baseline justify-between">
          <span class="text-[10px] text-slate-400 truncate max-w-[100px]" title="${m.meta.strategy}">${m.meta.strategy.replace("breakout_", "")}</span>
          <span class="text-xs font-black font-mono text-emerald-400">+£${m.meta.final_net.toFixed(0)}</span>
        </div>
        <div class="mt-1 text-[9px] text-slate-500 flex justify-between">
          <span>Closed: ${m.meta.closed_trades}</span>
          <span>Open: ${m.meta.open_trades}</span>
        </div>
      `;

      card.addEventListener("click", () => {
        if (highlightedModel === m.meta.model) {
          highlightedModel = null;
        } else {
          highlightedModel = m.meta.model;
        }
        updateCardStyles();
        renderChart();
      });

      legendContainer.appendChild(card);
    });

    function updateCardStyles() {
      models.forEach(m => {
        const card = document.getElementById(`card_${m.meta.model}`);
        if (!card) return;
        if (highlightedModel === null) {
          card.classList.remove("active");
          card.style.opacity = "1";
        } else if (highlightedModel === m.meta.model) {
          card.classList.add("active");
          card.style.opacity = "1";
        } else {
          card.classList.remove("active");
          card.style.opacity = "0.35";
        }
      });
    }

    document.getElementById("btnToggleAll").addEventListener("click", () => {
      highlightedModel = null;
      updateCardStyles();
      renderChart();
    });

    document.getElementById("btnReset").addEventListener("click", () => {
      highlightedModel = "DNA_201079";
      updateCardStyles();
      renderChart();
    });

    function renderChart() {
      const width = wrapper.clientWidth;
      const height = wrapper.clientHeight;
      const padLeft = 55;
      const padRight = 20;
      const padTop = 25;
      const padBottom = 35;

      const chartW = width - padLeft - padRight;
      const chartH = height - padTop - padBottom;

      const minVal = -80;
      const maxVal = 750;

      function getX(idx) {
        return padLeft + (idx / (timestamps.length - 1)) * chartW;
      }
      function getY(val) {
        return padTop + chartH - ((val - minVal) / (maxVal - minVal)) * chartH;
      }

      let svgHtml = '';

      // Grid lines & Y labels
      const yTicks = [-50, 0, 100, 200, 300, 400, 500, 600, 700];
      yTicks.forEach(tick => {
        const y = getY(tick);
        const strokeColor = tick === 0 ? '#475569' : '#1e293b';
        const strokeWidth = tick === 0 ? '1.5' : '1';
        const strokeDash = tick === 0 ? '' : 'stroke-dasharray="3,3"';
        svgHtml += `<line x1="${padLeft}" y1="${y}" x2="${width - padRight}" y2="${y}" stroke="${strokeColor}" stroke-width="${strokeWidth}" ${strokeDash} />`;
        svgHtml += `<text x="${padLeft - 10}" y="${y + 3.5}" fill="#64748b" font-size="10" text-anchor="end" font-family="monospace">£${tick}</text>`;
      });

      // X labels (every ~3 hours)
      const hoursToLabel = ["00:00", "03:00", "06:00", "09:00", "12:00", "15:00", "18:00", "21:00", "23:55"];
      timestamps.forEach((t, idx) => {
        if (hoursToLabel.some(h => t.startsWith(h.substring(0, 3)) && t.endsWith(h.substring(3)))) {
          const x = getX(idx);
          svgHtml += `<line x1="${x}" y1="${padTop}" x2="${x}" y2="${padTop + chartH}" stroke="#1e293b" stroke-width="1" stroke-dasharray="2,4" />`;
          svgHtml += `<text x="${x}" y="${height - 10}" fill="#64748b" font-size="10" text-anchor="middle" font-family="monospace">${t}</text>`;
        }
      });

      // Pre-index series data by time for fast alignment
      models.forEach((m, mIdx) => {
        const color = colors[mIdx % colors.length];
        const isHighlighted = highlightedModel === null || highlightedModel === m.meta.model;
        const opacity = isHighlighted ? (highlightedModel === m.meta.model ? "1" : "0.85") : "0.15";
        const strokeWidth = highlightedModel === m.meta.model ? "3.5" : (isHighlighted ? "2" : "1");

        // Map series values against timestamps
        const timeMap = {};
        m.series.forEach(pt => { timeMap[pt.time] = pt.cum_net; });

        let pathStr = '';
        let lastKnown = 0;
        timestamps.forEach((t, tIdx) => {
          if (timeMap[t] !== undefined) {
            lastKnown = timeMap[t];
          }
          const x = getX(tIdx);
          const y = getY(lastKnown);
          if (tIdx === 0) {
            pathStr += `M ${x} ${y}`;
          } else {
            pathStr += ` L ${x} ${y}`;
          }
        });

        svgHtml += `<path d="${pathStr}" fill="none" stroke="${color}" stroke-width="${strokeWidth}" stroke-opacity="${opacity}" style="transition: stroke-opacity 0.2s, stroke-width 0.2s;" />`;
      });

      // Crosshair elements
      svgHtml += `
        <line id="crosshairX" x1="0" y1="${padTop}" x2="0" y2="${padTop + chartH}" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" style="display:none;" />
      `;

      svg.innerHTML = svgHtml;
    }

    renderChart();
    window.addEventListener("resize", renderChart);

    // Interactive Hover Tracking
    wrapper.addEventListener("mousemove", (e) => {
      const rect = wrapper.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const padLeft = 55;
      const padRight = 20;
      const chartW = rect.width - padLeft - padRight;

      if (mouseX < padLeft || mouseX > rect.width - padRight) {
        hideTooltip();
        return;
      }

      const ratio = (mouseX - padLeft) / chartW;
      const tIdx = Math.min(timestamps.length - 1, Math.max(0, Math.round(ratio * (timestamps.length - 1))));
      const timeStr = timestamps[tIdx];

      const crossX = padLeft + (tIdx / (timestamps.length - 1)) * chartW;
      const chX = document.getElementById("crosshairX");
      if (chX) {
        chX.setAttribute("x1", crossX);
        chX.setAttribute("x2", crossX);
        chX.style.display = "block";
      }

      // Build Tooltip HTML with top 5 or highlighted model
      let rowsHtml = '';
      const listToDisplay = highlightedModel 
        ? models.filter(m => m.meta.model === highlightedModel)
        : models.slice(0, 5); // show top 5 in hover tooltip to keep compact

      listToDisplay.forEach((m, idx) => {
        const pt = m.series.find(p => p.time === timeStr) || m.series[m.series.length - 1];
        const color = colors[models.indexOf(m) % colors.length];
        rowsHtml += `
          <div class="flex items-center justify-between gap-4 py-0.5 font-mono">
            <div class="flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full" style="background-color:${color}"></span>
              <span class="text-slate-200 font-semibold">${m.meta.model}</span>
            </div>
            <span class="font-bold ${pt.cum_net >= 0 ? 'text-emerald-400' : 'text-rose-400'}">£${pt.cum_net.toFixed(1)}</span>
          </div>
        `;
      });

      tooltip.style.display = "block";
      tooltip.style.left = `${crossX}px`;
      tooltip.style.top = `60px`;
      tooltip.innerHTML = `
        <div class="font-bold text-slate-100 border-b border-slate-700 pb-1 mb-1.5 font-mono flex justify-between">
          <span>${timeStr}</span>
          <span class="text-slate-400 text-[10px]">Snapshot #${tIdx + 1}</span>
        </div>
        ${rowsHtml}
        ${!highlightedModel ? '<div class="text-[9px] text-slate-500 pt-1 border-t border-slate-800 text-center">Click cards below to isolate any model</div>' : ''}
      `;
    });

    wrapper.addEventListener("mouseleave", hideTooltip);

    function hideTooltip() {
      tooltip.style.display = "none";
      const chX = document.getElementById("crosshairX");
      if (chX) chX.style.display = "none";
    }
  </script>
