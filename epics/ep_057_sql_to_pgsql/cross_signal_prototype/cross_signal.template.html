<script>
let DATA=__DATA__,loaded=false,CODE='__PRODUCT__',ASSET='F',PIPAUTO=true,DAYS=[];const TYPES={};
const PIPV=()=>+$('pip').value||1e-4;                       // price units per "pip" (editable; auto per instrument)
const dp=()=>Math.max(0,-Math.floor(Math.log10(PIPV()))+1); // decimals to show for prices
const autoPip=(px,type)=>type==='C'?10**(Math.floor(Math.log10(px))-4):(px>=50?0.01:0.0001);
function setPip(px){if(!PIPAUTO||!px)return;const pp=+autoPip(px,ASSET).toPrecision(3);$('pip').value=pp;$('d').value=+(5*pp).toPrecision(3)}
const $=id=>document.getElementById(id);
const fmt=t=>new Date(t).toTimeString().slice(0,8);
let dayStart=0;
const meanP=b=>{let s=0,n=0;b.p.forEach(x=>{s+=x[0]*x[1];n+=x[1]});return s/n};
const prep=()=>{DATA.forEach(b=>{b.m=meanP(b);b.mx=Math.max(...b.p.map(x=>x[0]));b.mn=Math.min(...b.p.map(x=>x[0]))});dayStart=DATA.length?new Date(DATA[0].t).setHours(0,0,0,0):0};
prep();
let startT=DATA.length?DATA[0].t:0, R0=DATA.length?DATA[0].m:0;
function setStart(t,r){startT=t;R0=r;$('start').value=fmt(t);$('ref').value=r.toFixed(dp());run()}

// Engine: up-cross -> BUY & ref ratchets to the new top; down-cross -> SELL & ref ratchets to the new bottom;
// stall with no cross -> ref pulled back to the recent top (long) / bottom (short) so a failure flips the signal.
// counter_1: fade the move. After price runs >= step away from ref, BUY once no trade has printed below the
// low for holdMs (floor), SELL once no trade has printed above the high for holdMs (ceiling). Ref resets to the signal price.
function engineCounter(startT,R0,d,holdMs,upto,repeat){
  let R=R0,dir=0,lo=1e9,hi=-1e9,loT=startT,hiT=startT;
  const steps=[{t:startT,R}],log=[],marks=[];
  for(const b of DATA){
    if(b.t<startT)continue; if(b.t>upto)break;
    let up=0,dn=0;for(const [p,n] of b.p){if(p>R+d)up+=n;else if(p<R-d)dn+=n}
    if(b.mn<lo){lo=b.mn;loT=b.t} if(b.mx>hi){hi=b.mx;hiT=b.t}
    let act='';
    if((repeat||dir!==1)&&lo<=R-d&&b.t-loT>=holdMs){
      act='BUY floor '+lo.toFixed(dp());marks.push({t:b.t,p:b.m,s:'B'});dir=1;R=b.m;lo=b.mn;hi=b.mx;loT=hiT=b.t;steps.push({t:b.t,R});
    }else if((repeat||dir!==-1)&&hi>=R+d&&b.t-hiT>=holdMs){
      act='SELL ceiling '+hi.toFixed(dp());marks.push({t:b.t,p:b.m,s:'S'});dir=-1;R=b.m;lo=b.mn;hi=b.mx;loT=hiT=b.t;steps.push({t:b.t,R});
    }
    log.push({t:b.t,R,up,dn,act:act.startsWith('BUY')?'BUY':act.startsWith('SELL')?'SELL':'',note:act,price:b.m,dir});
  }
  return {steps,log,marks,R,dir};
}
// Generic helper for simple engines: fire(b,ctx) returns 'B','S' or ''.
function simple(startT,R0,upto,onBatch){
  const st={R:R0,dir:0},steps=[{t:startT,R:R0}],log=[],marks=[];
  for(const b of DATA){
    if(b.t<startT)continue; if(b.t>upto)break;
    const r=onBatch(b,st)||{};const a=r.sig||'';
    if(a){marks.push({t:b.t,p:b.m,s:a});st.dir=a==='B'?1:a==='S'?-1:0}
    if(r.R!==undefined&&r.R!==st.R){st.R=r.R;steps.push({t:b.t,R:st.R})}
    log.push({t:b.t,R:st.R,up:r.up||0,dn:r.dn||0,act:a==='B'?'BUY':a==='S'?'SELL':a==='X'?'EXIT':'',note:r.note||'',price:b.m,dir:st.dir});
  }
  return {steps,log,marks,R:st.R,dir:st.dir};
}
// range_fade_1: fixed ref. BUY when price trades step below ref, SELL when step above (mean reversion to a fixed level).
function engineRangeFade(startT,R0,d,upto){
  return simple(startT,R0,upto,(b,st)=>{
    let up=0,dn=0;for(const [p,n] of b.p){if(p>R0+d)up+=n;else if(p<R0-d)dn+=n}
    if(b.mn<=R0-d&&st.dir!==1)return{sig:'B',up,dn,note:'BUY below ref-step'};
    if(b.mx>=R0+d&&st.dir!==-1)return{sig:'S',up,dn,note:'SELL above ref+step'};
    return{up,dn};
  });
}
// swing_1: zigzag reversal. Flip once price retraces one step from the running extreme; ref follows the extreme.
function engineSwing(startT,R0,d,upto){
  let hi=R0,lo=R0;
  return simple(startT,R0,upto,(b,st)=>{
    hi=Math.max(hi,b.mx);lo=Math.min(lo,b.mn);
    if(st.dir>=0&&b.mn<=hi-d&&hi>R0){const r={sig:'S',R:b.m,note:'SELL pullback from '+hi.toFixed(dp())};hi=lo=b.m;return r}
    if(st.dir<=0&&b.mx>=lo+d&&lo<R0){const r={sig:'B',R:b.m,note:'BUY bounce from '+lo.toFixed(dp())};hi=lo=b.m;return r}
    return{R:st.dir>0?hi:st.dir<0?lo:st.R};
  });
}
// channel_1: N-minute channel breakout (N = Hold). BUY above the prior N-min high, SELL below the prior N-min low.
function engineChannel(startT,R0,d,holdMs,upto){
  const win=[];
  return simple(startT,R0,upto,(b,st)=>{
    while(win.length&&b.t-win[0].t>holdMs)win.shift();
    let out={};
    if(win.length>2){
      const H=Math.max(...win.map(x=>x.mx)),L=Math.min(...win.map(x=>x.mn));
      if(b.mx>H&&st.dir!==1)out={sig:'B',R:H,note:'BUY break '+H.toFixed(dp())};
      else if(b.mn<L&&st.dir!==-1)out={sig:'S',R:L,note:'SELL break '+L.toFixed(dp())};
    }
    win.push(b);return out;
  });

  const rows=SAVED.slice().reverse().map(r=>`<tr data-id="${r.id}"><td>${r.saved_at.slice(5,16).replace('T',' ')}</td><td>${r.day}</td><td>${(r.code||'gbp').toUpperCase()} ${r.strategy}${r.slot==='B'?' (B)':''}${r.params.side==='B'?' · buy only':r.params.side==='S'?' · sell only':''} ${r.params.mode==='m'?r.params.minutes+'m':'n='+r.params.n}</td><td>${r.params.tp}/${r.params.sl}/${r.params.comm}${r.params.add_at?' +add '+r.params.add_at:''}</td><td>${r.stats.trades}</td><td>${r.stats.win_pct}%</td><td>${altH(r.stats.total_pips)}</td><td>${altH(r.stats.alt_total_pips)}</td><td>${(r.note||'').replace(/</g,'&lt;')}</td><td><button onclick="loadSaved('${r.id}')">Load</button> <button onclick="delSaved('${r.id}')">✕</button></td></tr>`).join('');
  $('saved').innerHTML=SAVED.length?`<div style="margin:6px 0 2px"><b>Saved results</b> (${SAVED.length})</div><div style="overflow:auto;max-height:260px;background:var(--panel);border-radius:8px"><table style="width:100%;border-collapse:collapse;font:11px ui-monospace,monospace;white-space:nowrap"><tr><th align=left>Saved</th><th align=left>Day</th><th align=left>Strategy</th><th align=left>TP/SL/comm</th><th align=left>Trades</th><th align=left>Win</th><th align=left>Total</th><th align=left>Alt</th><th align=left>Note</th><th></th></tr>${rows}</table></div>`:'';
  (flashIds||[]).forEach(id=>{const row=$('saved').querySelector('tr[data-id="'+id+'"]');if(row){row.classList.add('flash');row.scrollIntoView({block:'nearest'})}});
}
async function loadSaved(id){ // restore the day, strategy and settings of a saved result and re-run it
  const r=SAVED.find(x=>x.id===id);if(!r)return;const p=r.params;
  $('strat').value=r.strategy;$('sidemode').value=p.side||'both';$('brkn').value=p.n;$('lbmode').value=p.mode||'n';if(p.mode==='m')$('lbmin').value=p.minutes;$('tpp').value=p.tp;$('slp').value=p.sl;$('comm').value=p.comm;$('stopat').value=p.stop_at;
  $('d').value=p.step;$('addat').value=p.add_at||0;$('addsz').value=p.add_size||1;$('addmax').value=p.max_adds||1;$('hold').value=p.hold;$('freqk').value=p.freq_k;$('stall').value=p.stall;$('cmp').checked=false;
  if(r.code&&r.code!==CODE){CODE=r.code;ASSET=TYPES[CODE]||'F';$('inst').value=CODE;await fillDays(r.day)}
  PIPAUTO=false;$('pip').value=p.pip||0.0001;
  $('day').value=r.day;await loadDay(r.day,true);
  const [h,m,sec]=p.start.split(':').map(Number);startT=dayStart+((h*60+m)*60+(sec||0))*1000;setStart(startT,p.ref);
  $('savemsg').textContent='Loaded '+r.strategy+(p.mode==='m'?' '+p.minutes+'m':' n='+p.n)+' for '+r.day+(r.note?' – '+r.note:'');
}
async function delSaved(id){if(!confirm('Delete this saved result?'))return;await fetch('/api/results?id='+id,{method:'DELETE'});listSaved()}
$('save').onclick=saveResult;
// Day selection: quote ticks come from /api/ticks (served from the _price_capture.jsonl files).
const todayStr=new Date().toLocaleDateString('en-CA');
async function loadDay(day,keep){
  stopPlay();loaded=false;$('live').textContent='loading '+day+' (the first load of a day can take ~20 s)…';
  let j;try{j=await (await fetch('/api/ticks?code='+CODE+'&day='+day,{cache:'no-store'})).json()}catch(e){j={error:String(e)}}
  if(!Array.isArray(j)){$('live').textContent='no data: '+(j.error||'');return}
  const st=startT,r0=R0;DATA=resample(j,+$('freq').value);prep();byTn=-1;liveMarks=null;loaded=true;
  if(!DATA.length){$('live').textContent='no quotes for '+day;run();return}
  $('scrub').value=1000;if(!keep)setPip(DATA[0].m);liveMarks=null;
  if(keep&&st>=DATA[0].t&&st<=DATA[DATA.length-1].t)setStart(st,r0);else setStart(DATA[0].t,DATA[0].m);
  $('live').textContent=day+' · '+DATA.length+' ticks'+(day===todayStr?' · live':'');freqInfo();
}
async function fillDays(keep){
  let ds=[];try{ds=await (await fetch('/api/days?code='+CODE,{cache:'no-store'})).json()}catch(e){}
  DAYS=ds;const prev=keep||$('day').value;
  const wd=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short'});
  $('day').innerHTML=ds.slice().reverse().map(d=>`<option value="${d}">${d} ${wd(d)}${/Sat|Sun/.test(wd(d))?' · weekend':''}</option>`).join('');
  if(ds.includes(prev))$('day').value=prev;
}
async function init(){
  try{const j=await (await fetch('/api/instruments',{cache:'no-store'})).json();
    j.instruments.forEach(i=>TYPES[i.code]=i.type);if(j.sample_seconds&&[...$('freq').options].some(o=>+o.value===j.sample_seconds))$('freq').value=j.sample_seconds;
    const grp=(t,l)=>`<optgroup label="${l}">`+j.instruments.filter(i=>i.type===t).map(i=>`<option value="${i.code}">${i.code.toUpperCase()}</option>`).join('')+'</optgroup>';
    $('inst').innerHTML=grp('F','Forex')+grp('C','Crypto');
    const sr=j.sources||{};
    if(!j.feed_ok)badge('● no live quote source (API and Z: files both failing)',css('--dn'));
    else if(sr.F==='file'||sr.C==='file')badge('● quotes API down · live prices from the Z: file backup',css('--ref'));
  }catch(e){}
  if(!TYPES[CODE]){TYPES[CODE]='F';$('inst').innerHTML+=`<option>${CODE}</option>`}
  $('inst').value=CODE;ASSET=TYPES[CODE]||'F';
  try{PCFG=await (await fetch('/api/product-config',{cache:'no-store'})).json()}catch(e){}
  await fillDays();
  if(!DAYS.length){$('live').textContent='no capture days found (is serve_nocache.py running?)';return}
  const qd=new URLSearchParams(location.search).get('day');if(qd&&DAYS.includes(qd))$('day').value=qd;
  $('day').onchange=()=>loadDay($('day').value);
  $('inst').onchange=async()=>{CODE=$('inst').value;ASSET=TYPES[CODE]||'F';PIPAUTO=true;await fillDays();await loadDay($('day').value);needCfg()};
  const move=k=>{const i=DAYS.indexOf($('day').value)+k;if(i>=0&&i<DAYS.length){$('day').value=DAYS[i];loadDay(DAYS[i])}};
  $('dprev').onclick=()=>move(-1);$('dnext').onclick=()=>move(1);$('dreload').onclick=()=>loadDay($('day').value,true);
  await loadDay($('day').value);needCfg();
}
init();listSaved();
