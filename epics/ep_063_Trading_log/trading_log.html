<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trading Log</title>
<script src="/ep060-nav.js"></script>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0d1117;color:#e6edf3;font:14px/1.5 ui-monospace,Consolas,monospace}
main{padding:20px 24px;max-width:1100px}
h1{margin:0 0 12px;font:700 20px system-ui,sans-serif}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font:13px system-ui,sans-serif}
.bar button{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 14px;cursor:pointer}
.bar input,.bar select{background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:6px 8px;font:13px system-ui,sans-serif}
.bar button.on{background:#8fa0ff;color:#0d1117;border-color:#8fa0ff;font-weight:700}
#status{color:#8b949e;margin-left:auto}
#log{list-style:none;margin:0;padding:0;max-height:calc(100vh - 130px);overflow-y:auto;border:1px solid #263241;border-radius:8px}
#log li{padding:6px 12px;border-bottom:1px solid #1b232e;white-space:pre-wrap;overflow-wrap:anywhere}
#log li.closed{background:#161b22;color:#9aa7b4}
.tag{color:#8fa0ff}.buy{color:#3fb950}.sell{color:#f85149}.pos{color:#3fb950}.neg{color:#f85149}
.badge{background:#30363d;color:#e6edf3;border-radius:4px;padding:0 6px;font-size:12px}
</style></head><body><main>
<h1>Trading Log</h1>
<div class="bar"><button data-t="all" class="on">All</button><button data-t="forex">Forex</button><button data-t="crypto">Crypto</button>
<input id="f-model" placeholder="model" size="12"><input id="f-strategy" placeholder="strategy name" size="20"><select id="f-product"><option value="">all products</option></select>
<select id="f-signal"><option value="">buy + sell</option><option value="buy">buy</option><option value="sell">sell</option></select>
<span id="status">loading…</span></div>
<ul id="log"></ul>
</main>
<script>
var timer,type='all',log=document.getElementById('log'),st=document.getElementById('status');
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function row(r){
  var tag=type==='all'?'<span class="tag">['+esc(r.product_type)+']</span> - ':'';
  var q=Math.round(r.quantity*1e6)/1e6, base=esc(r.model.toLowerCase())+'  '+esc(r.strategy)+'  <span class="'+esc(r.side)+'">'+esc(r.side)+'</span> '+q+' '+esc(r.product)+' '+r.entry_price;
  if(r.status==='closed'){
    var n=r.net_return==null?'':' <span class="'+(r.net_return>=0?'pos':'neg')+'">net '+r.net_return.toFixed(2)+'</span>';
    return '<li class="closed">'+tag+esc(r.closed_at)+' <span class="badge">CLOSED'+(r.close_type?' · '+esc(r.close_type):'')+'</span> '+base+' → exit '+(r.exit_price==null?'':r.exit_price)+n+'</li>';
  }
  return '<li>'+tag+esc(r.created)+'  '+base+'</li>';
}
var fq='';function load(){
  var t=type;
  var qs='&'+['model','strategy','product','signal'].map(function(k){return k+'='+encodeURIComponent(document.getElementById('f-'+k).value)}).join('&');
  fq=qs;
  fetch('/api/trade_log?type='+t+'&limit=50'+qs,{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    if(t!==type||fq!==qs)return;
    if(d.error)throw new Error(d.error);
    log.innerHTML=d.rows.map(row).join('')||'<li>No trades</li>';
    st.textContent='updated '+d.generated_at.slice(11)+' · auto-refresh 10s';
  }).catch(function(e){st.textContent='error: '+e.message}).then(function(){clearTimeout(timer);timer=setTimeout(load,10000)});
}
document.querySelectorAll('.bar button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('.bar button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');type=b.dataset.t;loadProducts();load()}});
load();
</script></body></html>
