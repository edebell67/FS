<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switchboard demo</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var input = new URLSearchParams(window.location.search);
      var out = new URLSearchParams();
      out.set('src', input.get('src') || 'ep034_local_services_001');
      out.set('channel', input.get('channel') || 'manual');
      out.set('niche', input.get('niche') || 'local_services');

      var variant = input.get('variant') || input.get('v') || 'missed_calls_v1';
      if (variant === 'm1') variant = 'missed_calls_v1';
      if (variant === 'b1') variant = 'busy_with_customer_v1';
      out.set('variant', variant);

      var batch = input.get('batch') || input.get('b');
      if (batch) out.set('batch', String(batch).padStart(3, '0'));

      var target = input.get('target') || input.get('t');
      if (target) {
        if (/^\d+$/.test(target)) {
          target = 'ep034_local_services_001_' + String(target).padStart(4, '0');
        }
        out.set('target', target);
      }

      window.location.replace('../?' + out.toString());
    }());
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=../?src=ep034_local_services_001&channel=manual&niche=local_services">
  </noscript>
</head>
<body>
  <p>Opening the Switchboard demo…</p>
  <p><a href="../?src=ep034_local_services_001&channel=manual&niche=local_services">Continue to demo</a></p>
</body>
</html>
