<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111f; color: #e5eefb; font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; }
    main { max-width: 560px; padding: 32px; text-align: center; }
    a { color: #7dd3fc; }
  </style>
  <script>
    (function () {
      var base = '/epics/ep_034_lead_gen/switchboard_answering_service/';
      var map = {
        '1': '?src=ep034_local_services_001&channel=manual&niche=local_services&variant=missed_calls_v1&batch=001&target=ep034_local_services_001_0001',
        '2': '?src=ep034_local_services_001&channel=manual&niche=local_services&variant=busy_with_customer_v1&batch=001&target=ep034_local_services_001_0002',
        '3': '?src=ep034_local_services_001&channel=manual&niche=local_services&variant=missed_calls_v1&batch=001&target=ep034_local_services_001_0003',
        '4': '?src=ep034_local_services_001&channel=manual&niche=local_services&variant=busy_with_customer_v1&batch=001&target=ep034_local_services_001_0004',
        '5': '?src=ep034_local_services_001&channel=manual&niche=local_services&variant=missed_calls_v1&batch=001&target=ep034_local_services_001_0005'
      };
      var token = (window.location.search || '').replace(/^\?/, '') || (window.location.hash || '').replace(/^#/, '');
      token = decodeURIComponent(token).trim();
      var query = map[token];
      var fallback = base + '?src=ep034_short_redirect&channel=manual&niche=local_services';
      var destination = query ? base + query : fallback;
      window.location.replace(destination);
      window.__ep034RedirectDestination = destination;
    })();
  </script>
</head>
<body>
  <main>
    <h1>Redirecting…</h1>
    <p>If this does not redirect, open the <a href="/epics/ep_034_lead_gen/switchboard_answering_service/">Switchboard demo page</a>.</p>
  </main>
</body>
</html>
