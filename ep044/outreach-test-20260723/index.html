<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private concept follow-up — test only</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;background:#f4f3ef;color:#0b0f10;margin:0;padding:48px 20px}main{max-width:560px;margin:auto;background:#fff;border:1px solid #d9d8d1;padding:32px}a{color:#0b0f10;font-weight:700}</style>
</head>
<body>
  <main>
    <p><strong>THE TECH PRINCIPLE</strong></p>
    <h1>Tracking test</h1>
    <p>This is a user-owned follow-up tracking test. No prospect data is present and no appointment is being created.</p>
    <p id="status" aria-live="polite">Confirming the test event…</p>
    <p><a id="request" href="mailto:edward.bell@thetechprinciple.com?subject=TEST%20ONLY%20%E2%80%94%2015-minute%20review%20request">Open an email appointment-request test →</a></p>
  </main>
  <script>
    const endpoint = 'https://shared-website-assistant-api.onrender.com/api/public/events';
    const clientKey = 'batch02_heron_property_services_limited';
    const sessionId = crypto.randomUUID();
    async function track(type, label) {
      const payload = {clientKey, host:'thetechprinciple.com', sessionId, events:[{type,label,path:'/outreach-test-20260723/',referrerHost:'',device:'desktop',ts:new Date().toISOString()}]};
      try {
        const response = await fetch(endpoint, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(payload)});
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const result = await response.json();
        document.getElementById('status').textContent = result.stored === 1 ? 'Tracking test confirmed.' : 'Tracking endpoint accepted the test, but did not store an event.';
      } catch {
        document.getElementById('status').textContent = 'Tracking could not be confirmed. Please reload the test page.';
      }
    }
    track('pageview', 'followup:test_only');
    document.getElementById('request').addEventListener('click', () => { navigator.sendBeacon(endpoint, new Blob([JSON.stringify({clientKey, host:'thetechprinciple.com', sessionId, events:[{type:'cta_click',label:'followup:appointment_email_test',path:'/outreach-test-20260723/',referrerHost:'',device:'desktop',ts:new Date().toISOString()}]})], {type:'text/plain'})); });
  </script>
</body>
</html>
