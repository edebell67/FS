name: verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        run: pip install -r arena/requirements.txt
      - name: Test simulation engine
        run: node --test arena/tests/engine.test.cjs
      - name: Import production application
        run: python -c "from arena.server import app; assert app.title == 'Agentic Arena Showcase'"
